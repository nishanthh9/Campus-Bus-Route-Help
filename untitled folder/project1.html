<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132f3c">
  <title>Campusloop | Campus Bus Route Finder</title>

  <style>
    :root {
      color-scheme: light;
      --paper: #f6f8f6;
      --ink: #182e35;
      --muted: #546860;
      --green: #206449;
      --line: #d5dfd9;
      --white: #fff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 system-ui, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button, input, select, textarea {
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      padding: .6rem .85rem;
    }
    button:hover { border-color: var(--green); }
    :focus-visible { outline: 3px solid #298e78; outline-offset: 3px; }
    [hidden] { display: none !important; }
    h1, h2, h3, p { margin: 0; }
    h2 { font-size: clamp(1.55rem, 4vw, 2rem); letter-spacing: -.04em; }
    .wrap { width: min(1120px, 92%); margin-inline: auto; }

    header { background: white; border-bottom: 1px solid var(--line); }
    .bar, nav, .actions, .card-top, .card-bottom, .section-head {
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .bar { min-height: 70px; }
    .brand {
      display: flex;
      align-items: center;
      gap: .55rem;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.06em;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #153e37;
      color: #a4f0c8;
    }
    nav { margin-left: 1rem; flex-wrap: wrap; }
    nav button { border: 0; background: transparent; }
    nav button[aria-current="page"] {
      background: #e6f1ea;
      color: var(--green);
      font-weight: 700;
    }
    #add { margin-left: auto; white-space: nowrap; }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      margin: 1.5rem 0 2rem;
      border-radius: 20px;
      overflow: hidden;
      color: white;
      background-color: #132f3c;
      background-image: radial-gradient(#ffffff19 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .intro { padding: clamp(1.6rem, 4vw, 3rem); }
    .eyebrow {
      color: #a3e2c3;
      font: 600 .8rem ui-monospace, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: .7rem 0;
      font-size: clamp(2.7rem, 6vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.07em;
    }
    h1 span { color: #94e2b7; }
    .intro p { max-width: 36ch; color: #d0e0df; }
    .map { width: 100%; height: auto; display: block; }
    .map text {
      fill: #e4f0ee;
      font: 600 12px ui-monospace, monospace;
      stroke: #132f3c;
      stroke-width: 4px;
      paint-order: stroke;
    }
    .vehicle {
      offset-rotate: 0deg;
      animation: travel 13s linear infinite;
    }
    .vehicle.blue { animation-duration: 17s; }
    @keyframes travel { to { offset-distance: 100%; } }

    .section-head { justify-content: space-between; }
    .muted, footer { color: var(--muted); }
    .pill, .code {
      display: inline-block;
      padding: .2rem .6rem;
      border-radius: 6px;
      font: 700 .83rem/1.5 ui-monospace, monospace;
    }
    .pill { background: #e6eee7; white-space: nowrap; }
    .code { background: var(--tint, #e3f0e6); color: var(--tone, #225c41); }
    .controls { display: flex; gap: .7rem; margin: 1.1rem 0; }
    .controls input { flex: 1; min-width: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 1rem;
    }
    .card, .box {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.2rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      animation: appear .22s ease-out;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px #173e3010; }
    .card h3 { font-size: 1.35rem; letter-spacing: -.04em; margin: .8rem 0 .25rem; }
    .card-top { flex-wrap: wrap; }
    .favorite {
      margin-left: auto;
      line-height: 1;
      font-size: 1.35rem;
      border: 0;
      padding: .4rem;
      color: var(--green);
    }
    .status { font-size: .85rem; color: #46614f; }
    .status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dot, #43875b);
      margin-right: .35rem;
    }
    .ends { color: var(--muted); overflow-wrap: anywhere; margin-bottom: 1rem; }
    .card-bottom {
      border-top: 1px solid var(--line);
      padding-top: .7rem;
      justify-content: space-between;
      margin-top: auto;
      font-size: .86rem;
    }
    .text-button { border: 0; padding: .3rem 0; color: var(--green); font-weight: 700; }
    .primary { background: var(--green); color: white; border-color: var(--green); }
    .box { margin-top: 1rem; }
    .metric { font-size: 2rem; display: block; }
    .actions { flex-wrap: wrap; margin-top: 1rem; }
    footer {
      margin-top: 2.5rem;
      padding: 1.25rem 0;
      border-top: 1px solid var(--line);
      font-size: .85rem;
    }
    dialog {
      width: min(500px, 94vw);
      max-height: 88vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.5rem;
      color: var(--ink);
    }
    dialog[open] { animation: appear .18s ease-out; }
    dialog::backdrop { background: #10272fb0; }
    .close { float: right; margin: -.25rem -.25rem .5rem .5rem; }
    form { display: grid; gap: .8rem; margin-top: 1rem; }
    label { display: grid; gap: .25rem; font-size: .9rem; font-weight: 650; }
    textarea { resize: vertical; }
    ol { padding-left: 1.5rem; }
    li { padding: .25rem 0; overflow-wrap: anywhere; }
    .error { color: #9e3227; white-space: pre-line; }
    #notice {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #173f34;
      color: white;
      padding: .6rem 1rem;
      border-radius: 10px;
      text-align: center;
      pointer-events: none;
    }
    #notice:empty { display: none; }
    @keyframes appear {
      from { opacity: 0; translate: 0 6px; }
      to { opacity: 1; translate: 0 0; }
    }
    @media (max-width: 680px) {
      .bar { flex-wrap: wrap; padding: .7rem 0; }
      nav { order: 3; width: 100%; margin: 0; gap: .25rem; }
      nav button { padding: .4rem .65rem; }
      .hero { grid-template-columns: 1fr; }
      .intro { padding-bottom: 0; }
      .map { height: 145px; }
      .controls { flex-wrap: wrap; }
      .controls input { flex-basis: 60%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap bar">
      <div class="brand"><span class="mark" aria-hidden="true">≋</span>Campusloop</div>
      <nav aria-label="Main navigation">
        <button data-view="directory" aria-current="page">Route finder</button>
        <button data-view="saved">Saved routes</button>
        <button data-view="network">Network</button>
      </nav>
      <button id="add">+ Add route</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="intro">
        <div class="eyebrow">Campus transit atlas</div>
        <h1>Find your<br>campus route<span>.</span></h1>
        <p>Explore bus routes and find the stops that connect your campus.</p>
      </div>

      <svg class="map" viewBox="0 0 500 240" aria-hidden="true">
        <g fill="none" stroke-width="5" stroke-linejoin="round">
          <path stroke="#91e1b6" d="M0 190H80L155 115H265L335 45H430L490 0"/>
          <path stroke="#8dc5f4" d="M45 0V40L120 115H200L270 185H410L475 120H500"/>
          <path stroke="#f1b487" d="M0 55H70L130 115H200L270 45V0"/>
          <path stroke="#c8b6ee" d="M120 240V205L175 150H245L290 105H385L465 25H500"/>
        </g>
        <g fill="#17333e" stroke="white" stroke-width="3">
          <circle cx="80" cy="190" r="5"/>
          <circle cx="155" cy="115" r="5"/>
          <circle cx="200" cy="115" r="6"/>
          <circle cx="335" cy="45" r="5"/>
          <circle cx="410" cy="185" r="5"/>
          <circle cx="175" cy="150" r="5"/>
        </g>
        <circle class="vehicle" r="3.5" fill="white"
          style="offset-path:path('M0 190H80L155 115H265L335 45H430L490 0')"/>
        <circle class="vehicle blue" r="3.5" fill="white"
          style="offset-path:path('M45 0V40L120 115H200L270 185H410L475 120H500')"/>
        <text x="48" y="212">Main Gate</text>
        <text x="166" y="101">Central Plaza</text>
        <text x="326" y="31">Science Quad</text>
        <text x="155" y="173">Library</text>
        <text x="385" y="208">East Gate</text>
      </svg>
    </section>

    <section aria-labelledby="heading">
      <div class="section-head">
        <div>
          <h2 id="heading">Route directory</h2>
          <p class="muted" id="subtitle"></p>
        </div>
        <span class="pill" id="count"></span>
      </div>

      <div class="controls" id="controls">
        <input type="search" id="search" aria-label="Search routes or stops"
               placeholder="Search by stop, route name, or code…">
        <select id="filter" aria-label="Filter service status">
          <option value="">All services</option>
          <option>In service</option>
          <option>Limited</option>
          <option>Suspended</option>
        </select>
      </div>
      <div id="results"></div>
    </section>

    <footer>Campusloop · Sample campus network · Records stored in this browser</footer>
  </main>

  <dialog id="panel" aria-labelledby="dialogTitle">
    <button class="close" id="close" aria-label="Close dialog">×</button>
    <div id="panelBody"></div>
  </dialog>
  <div id="notice" role="status"></div>

  <script>
    "use strict";

    const $ = selector => document.querySelector(selector);
    const KEY = "campusloop.singlefile.v1";
    const statuses = ["In service", "Limited", "Suspended"];
    const columns = ["code", "name", "status", "minutes", "stops"];
    const palettes = [
      ["#225c41", "#dff1e5"], ["#30568a", "#e2edff"],
      ["#874c22", "#ffe8d6"], ["#694789", "#efe6ff"],
      ["#775819", "#faf0cb"], ["#226371", "#ddf1f3"]
    ];

    function route(code, name, minutes, stops, status = "In service") {
      return { code, name, minutes, stops: stops.split("|"), status };
    }

    const sampleRoutes = [
      route("R01", "Central Loop", 10,
        "Main Gate|Admin Hall|Library|Student Union|Central Plaza|East Gate"),
      route("R02", "North Campus", 15,
        "North Gate|Engineering Hall|Innovation Lab|Library|Science Quad|Observatory"),
      route("R03", "Residence Link", 12,
        "West Halls|Maple House|Cedar House|Dining Hall|Student Union|Central Plaza"),
      route("R04", "East Express", 20,
        "East Gate|Design School|Arts Centre|Music Hall|Main Gate"),
      route("R05", "Sports Shuttle", 25,
        "Central Plaza|Health Centre|Aquatics Centre|Sports Hall|Stadium", "Limited"),
      route("R06", "Library Line", 15,
        "South Gate|Transit Hub|Business School|Law School|Study Commons|Library")
    ];

    let routes = sampleRoutes;
    let saved = [];
    let view = "directory";
    let noticeTimer;

    function notify(message) {
      $("#notice").textContent = message;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => $("#notice").textContent = "", 3500);
    }

    function escapeHTML(value) {
      const chars = {
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      };
      return String(value).replace(/[&<>"']/g, char => chars[char]);
    }

    function validText(value, max) {
      return typeof value === "string" &&
        value.trim().length > 0 && value.trim().length <= max &&
        !/[\u0000-\u001f]/.test(value);
    }

    function validate(raw) {
      if (!raw || typeof raw !== "object") throw Error("Expected a route record.");
      const code = String(raw.code ?? "").trim().toUpperCase();
      if (!/^[A-Z0-9-]{1,8}$/.test(code))
        throw Error("Use 1–8 letters, numbers, or hyphens for the route code.");
      if (!validText(raw.name, 60))
        throw Error("Enter a route name of 1–60 characters.");
      if (!statuses.includes(raw.status))
        throw Error("Choose a valid service status.");
      if (!["number", "string"].includes(typeof raw.minutes))
        throw Error("Enter a numeric interval.");
      const minutes = Number(raw.minutes);
      if (!Number.isInteger(minutes) || minutes < 1 || minutes > 240)
        throw Error("The interval must be a whole number from 1 to 240 minutes.");
      if (!Array.isArray(raw.stops) || raw.stops.length < 2 || raw.stops.length > 60)
        throw Error("Enter between 2 and 60 stops.");
      if (raw.stops.some(stop => !validText(stop, 60) || stop.includes("|")))
        throw Error("Each stop needs 1–60 characters and cannot contain a vertical bar.");
      return {
        code, name: raw.name.trim(), status: raw.status, minutes,
        stops: raw.stops.map(stop => stop.trim())
      };
    }

    function load() {
      try {
        const text = localStorage.getItem(KEY);
        if (!text) return;
        const data = JSON.parse(text);
        const checked = data.routes.map(validate);
        const codes = new Set(checked.map(r => r.code));
        if (codes.size !== checked.length) throw Error("Duplicate codes.");
        routes = checked;
        saved = Array.isArray(data.saved) ? data.saved.filter(c => codes.has(c)) : [];
      } catch {
        notify("Saved data couldn't be read. Showing the sample routes.");
      }
    }

    function persist(nextRoutes, nextSaved) {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          routes: nextRoutes, saved: nextSaved
        }));
      } catch {
        throw Error("Browser storage is unavailable. Your change could not be saved.");
      }
      routes = nextRoutes;
      saved = nextSaved;
      render();
    }

    function routeCard(r) {
      const [tone, tint] = palettes[routes.indexOf(r) % palettes.length];
      const marked = saved.includes(r.code);
      const dot = {
        "In service": "#43875b", Limited: "#bc852b", Suspended: "#b44e45"
      }[r.status];

      return `
        <article class="card" style="--tone:${tone};--tint:${tint};--dot:${dot}">
          <div class="card-top">
            <span class="code">${r.code}</span>
            <span class="status">${r.status}</span>
            <button class="favorite" data-save="${r.code}"
              aria-label="${marked ? "Unsave" : "Save"} ${escapeHTML(r.name)}"
              aria-pressed="${marked}">${marked ? "★" : "☆"}</button>
          </div>
          <h3>${escapeHTML(r.name)}</h3>
          <p class="ends">${escapeHTML(r.stops[0])} → ${escapeHTML(r.stops.at(-1))}</p>
          <div class="card-bottom">
            <span>${r.stops.length} stops · ${
              r.status === "Suspended" ? "Paused" : `Every ${r.minutes} min`
            }</span>
            <button class="text-button" data-details="${r.code}">View route</button>
          </div>
        </article>`;
    }

    function summary() {
      const stops = new Set(routes.flatMap(r => r.stops.map(s => s.toLowerCase())));
      const running = routes.filter(r => r.status !== "Suspended");
      const average = running.length
        ? Math.round(running.reduce((sum, r) => sum + r.minutes, 0) / running.length)
        : null;
      return { total: routes.length, stops: stops.size, average };
    }

    function networkView() {
      const stats = summary();
      const metrics = [
        [stats.total, "Routes"], [stats.stops, "Unique stops"],
        [stats.average ?? "—", "Average interval (min)"]
      ];
      const alerts = routes.filter(r => r.status !== "In service");

      return `
        <div class="grid">${metrics.map(([value, label]) =>
          `<div class="box"><strong class="metric">${value}</strong>${label}</div>`
        ).join("")}</div>
        <div class="box">
          <h3>Service overview</h3>
          <p class="muted">${statuses.map(s =>
            `${routes.filter(r => r.status === s).length} ${s.toLowerCase()}`
          ).join(" · ")}</p>
          ${alerts.map(r => `<p><button class="text-button" data-details="${r.code}">
            ${escapeHTML(r.name)}</button> · ${r.status}</p>`).join("")}
        </div>
        <div class="box">
          <h3>Route data</h3>
          <p class="muted">Back up your routes or import an existing directory.</p>
          <div class="actions">
            <button data-import>Import routes</button>
            <button data-export="json">Export JSON</button>
            <button data-export="csv">Export CSV</button>
            <button data-export="md">Export summary</button>
          </div>
        </div>`;
    }

    function render() {
      const network = view === "network";
      const bookmarks = view === "saved";
      $("#heading").textContent = network ? "Network overview"
        : bookmarks ? "Saved routes" : "Route directory";
      $("#subtitle").textContent = network ? "Service coverage and route data."
        : bookmarks ? "Routes you bookmarked on this device."
        : "Search by stop, route name, or route code.";
      $("#controls").hidden = network;

      document.querySelectorAll("[data-view]").forEach(button => {
        if (button.dataset.view === view) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });

      const query = $("#search").value.trim().toLowerCase();
      const status = $("#filter").value;
      const matches = routes.filter(r =>
        (!bookmarks || saved.includes(r.code)) &&
        (!status || r.status === status) &&
        [r.code, r.name, ...r.stops].some(s => s.toLowerCase().includes(query))
      );
      const count = network ? routes.length : matches.length;
      $("#count").textContent = `${count} ${count === 1 ? "route" : "routes"}`;

      if (network) $("#results").innerHTML = networkView();
      else if (matches.length)
        $("#results").innerHTML = `<div class="grid">${matches.map(routeCard).join("")}</div>`;
      else
        $("#results").innerHTML = `<div class="box">${
          bookmarks && !saved.length
            ? "Select the star on any route to save it here."
            : "No matching routes. Try a different stop or service filter."
        }</div>`;
    }

    function showPanel(html) {
      $("#panelBody").innerHTML = html;
      if (!$("#panel").open) $("#panel").showModal();
    }

    function showDetails(code) {
      const r = routes.find(item => item.code === code);
      if (!r) return;
      showPanel(`
        <span class="code">${r.code}</span>
        <h2 id="dialogTitle">${escapeHTML(r.name)}</h2>
        <p class="muted">${r.status}${
          r.status === "Suspended" ? "" : ` · Every ${r.minutes} minutes`
        }</p>
        <h3 style="margin-top:1rem">Stops in order</h3>
        <ol>${r.stops.map(s => `<li>${escapeHTML(s)}</li>`).join("")}</ol>
        <button id="edit">Edit route</button>
      `);
      $("#edit").onclick = () => showEditor(r);
    }

    function showEditor(original = null) {
      showPanel(`
        <h2 id="dialogTitle">${original ? "Edit route" : "Add route"}</h2>
        <form id="routeForm">
          <label>Route code
            <input name="code" required maxlength="8"
              value="${escapeHTML(original?.code ?? "")}" placeholder="R07">
          </label>
          <label>Route name
            <input name="name" required maxlength="60"
              value="${escapeHTML(original?.name ?? "")}" placeholder="South Shuttle">
          </label>
          <label>Service status
            <select name="status">${statuses.map(s => `
              <option ${s === original?.status ? "selected" : ""}>${s}</option>
            `).join("")}</select>
          </label>
          <label>Scheduled interval in minutes
            <input name="minutes" type="number" min="1" max="240" step="1"
              required value="${original?.minutes ?? 15}">
          </label>
          <label>Stops in travel order, one per line
            <textarea name="stops" rows="5" required>${
              escapeHTML(original?.stops.join("\n") ?? "")
            }</textarea>
          </label>
          <p class="error" role="alert"></p>
          <button class="primary" type="submit">Save route</button>
        </form>
      `);
      $("#routeForm").onsubmit = event => {
        event.preventDefault();
        try {
          const data = Object.fromEntries(new FormData(event.currentTarget));
          data.stops = data.stops.trim().split(/\r?\n/);
          const checked = validate(data);
          if (routes.some(r => r !== original && r.code === checked.code))
            throw Error("That route code is already in use.");
          const next = original
            ? routes.map(r => r === original ? checked : r)
            : [...routes, checked];
          const bookmarks = saved.map(c => c === original?.code ? checked.code : c);
          persist(next, bookmarks);
          showDetails(checked.code);
          notify("Route saved.");
        } catch (error) {
          $("#routeForm .error").textContent = error.message;
        }
      };
    }

    function download(format) {
      let data;
      if (format === "json") {
        data = JSON.stringify(routes, null, 2);
      } else if (format === "csv") {
        const quote = value => `"${String(value).replaceAll('"', '""')}"`;
        const rows = routes.map(r => columns.map(key =>
          quote(key === "stops" ? r.stops.join("|") : r[key])
        ).join(","));
        data = [columns.join(","), ...rows].join("\r\n");
      } else {
        const s = summary();
        data = [
          "# Campusloop network summary", "",
          `Routes: ${s.total}`, `Unique stops: ${s.stops}`,
          `Average running interval: ${s.average === null ? "N/A" : s.average + " min"}`,
          "", ...routes.map(r =>
            `- ${r.code} ${r.name} — ${r.status}, ${r.stops.length} stops`
          )
        ].join("\n");
      }

      const mime = { json: "application/json", csv: "text/csv", md: "text/markdown" };
      const url = URL.createObjectURL(new Blob([data], { type: mime[format] }));
      const link = document.createElement("a");
      link.href = url;
      link.download = `campusloop.${format}`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function parseCSV(text) {
      // A quoted CSV field may contain a comma or an escaped double quote.
      const rows = [];
      let row = [], field = "", quoted = false, closedQuote = false;

      function endField() {
        row.push(field);
        field = "";
        closedQuote = false;
      }

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) {
          if (c !== '"') field += c;
          else if (text[i + 1] === '"') { field += '"'; i++; }
          else { quoted = false; closedQuote = true; }
        } else if (c === ",") {
          endField();
        } else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          endField();
          rows.push(row);
          row = [];
        } else if (c === '"' && field === "" && !closedQuote) {
          quoted = true;
        } else {
          if (closedQuote || c === '"')
            throw Error(`Invalid quoting in CSV record ${rows.length + 1}.`);
          field += c;
        }
      }
      if (quoted) throw Error("CSV contains an unclosed quote.");
      if (field || row.length || closedQuote) { endField(); rows.push(row); }

      const header = rows.shift() ?? [];
      if (header.length !== columns.length || !columns.every(k => header.includes(k)))
        throw Error(`Expected CSV columns: ${columns.join(", ")}.`);
      return rows.map((values, index) => {
        if (values.length !== columns.length)
          throw Error(`CSV data record ${index + 1} has the wrong number of columns.`);
        const record = Object.fromEntries(header.map((key, i) => [key, values[i]]));
        record.stops = record.stops.split("|");
        return record;
      });
    }

    function showImport() {
      showPanel(`
        <h2 id="dialogTitle">Import routes</h2>
        <p class="muted">Import a Campusloop JSON or CSV file. Matching route codes
          update existing routes. New codes add routes.</p>
        <form id="importForm">
          <label>Route file<input type="file" accept=".json,.csv" required></label>
          <p class="error" role="alert"></p>
          <button class="primary">Import file</button>
        </form>
      `);
      $("#importForm").onsubmit = async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const file = form.querySelector("input").files[0];
        try {
          const text = (await file.text()).replace(/^\uFEFF/, "");
          const rows = file.name.toLowerCase().endsWith(".csv")
            ? parseCSV(text) : JSON.parse(text);
          if (!Array.isArray(rows) || !rows.length)
            throw Error("The file must contain a non-empty list of routes.");

          // Validate the entire import before saving any changes.
          const incoming = new Map();
          const errors = [];
          rows.forEach((raw, i) => {
            try {
              const r = validate(raw);
              if (incoming.has(r.code)) throw Error(`Duplicate code ${r.code}.`);
              incoming.set(r.code, r);
            } catch (error) {
              errors.push(`Record ${i + 1}: ${error.message}`);
            }
          });
          if (errors.length) throw Error(errors.join("\n"));

          const merged = new Map(routes.map(r => [r.code, r]));
          incoming.forEach((r, code) => merged.set(code, r));
          persist([...merged.values()], saved);
          $("#panel").close();
          notify(`Imported ${incoming.size} ${incoming.size === 1 ? "route" : "routes"}.`);
        } catch (error) {
          form.querySelector(".error").textContent = error.message;
        }
      };
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      const { view: nextView, save, details, export: format } = button.dataset;
      if (nextView) {
        view = nextView;
        $("#search").value = "";
        $("#filter").value = "";
        render();
      } else if (save) {
        try {
          const wasSaved = saved.includes(save);
          persist(routes, wasSaved ? saved.filter(c => c !== save) : [...saved, save]);
          notify(wasSaved ? "Removed from saved routes." : "Route bookmarked.");
        } catch (error) { notify(error.message); }
      } else if (details) showDetails(details);
      else if (format) download(format);
      else if (button.hasAttribute("data-import")) showImport();
    });

    $("#add").onclick = () => showEditor();
    $("#close").onclick = () => $("#panel").close();
    $("#search").oninput = render;
    $("#filter").onchange = render;

    load();
    render();
  </script>
</body>
</html>
